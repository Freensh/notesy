{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Scrib{% endblock %}</title>
  <meta name="description" content="{% block description %}Scrib is a fast, simple notes tool for your team.{% endblock %}">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="{% static 'images/favicon.ico' %}" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32.png' %}">
  <link rel="apple-touch-icon" href="{% static 'images/favicon-180.png' %}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Scrib">
  <meta property="og:title" content="{% block og_title %}Scrib: quick notes for your team{% endblock %}">
  <meta property="og:description" content="Fast to write. Easy to find.">
  <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'images/og-image.jpg' %}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="{% static 'js/styles.css' %}">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="{% static 'js/editor.js' %}" defer></script>
  <script src="{% static 'js/shortcuts.js' %}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/" aria-label="Scrib home"><img src="{% static 'images/scrib-wordmark.webp' %}" alt="Scrib" width="120" height="32"></a>
      <nav class="nav">
        {% if user.is_authenticated %}
          <span class="nav__user">{{ user.username }}</span>
          <a href="{% url 'logout' %}" class="btn">Log out</a>
        {% else %}
          {% block nav_anon %}<a href="{% url 'login' %}" class="btn btn--primary">Log in</a>{% endblock %}
        {% endif %}
      </nav>
    </div>
  </header>
  {% block body %}
  <main class="page">
    <div class="container container--app">{% block content %}{% endblock %}</div>
  </main>
  {% endblock %}
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>&copy; Scrib</span>
      <span>Simple notes for your team.</span>
    </div>
  </footer>
</body>
</html>
