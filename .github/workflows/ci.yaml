name: CI
 
on:
  push:
    branches: [feature/ci, staging]
  pull_request:
    branches: [main]
 
jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notesy_test
          POSTGRES_USER: notesy
          POSTGRES_PASSWORD: notesy_test_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: notesy_test
      POSTGRES_USER: notesy
      POSTGRES_PASSWORD: notesy_test_pw
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: "ci-test-key"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for SonarCloud's new-code analysis
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run build          # runs prebuild -> typecheck, then esbuild
      - run: python manage.py collectstatic --noinput
      - run: pytest -v
 
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false          # this job only proves the image builds; Milestone 3 handles publishing
  sonarcloud:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  publish:
    runs-on: ubuntu-latest
    needs: [backend-test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write     # required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
 
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
 
      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
 
      - name: Log in to JFrog
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.JFROG_URL }}
          username: ${{ secrets.JFROG_USERNAME }}
          password: ${{ secrets.JFROG_ACCESS_TOKEN }}
 
      - name: Build once, tag for both registries
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t local-build:$IMAGE_TAG .
          docker tag local-build:$IMAGE_TAG ${{ steps.ecr-login.outputs.registry }}/notesy:$IMAGE_TAG
          docker tag local-build:$IMAGE_TAG ${{ steps.ecr-login.outputs.registry }}/notesy:latest
          docker tag local-build:$IMAGE_TAG ${{ secrets.JFROG_URL }}/notesy-docker-local/notesy:$IMAGE_TAG
          docker tag local-build:$IMAGE_TAG ${{ secrets.JFROG_URL }}/notesy-docker-local/notesy:latest
 
      - name: Push to both registries
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/notesy:$IMAGE_TAG
          docker push ${{ steps.ecr-login.outputs.registry }}/notesy:latest
          docker push ${{ secrets.JFROG_URL }}/notesy-docker-local/notesy:$IMAGE_TAG
          docker push ${{ secrets.JFROG_URL }}/notesy-docker-local/notesy:latest

