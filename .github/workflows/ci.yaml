name: CI
 
on:
  pull_request:
  push:
    branches: [main]
 
jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notesy_test
          POSTGRES_USER: notesy
          POSTGRES_PASSWORD: notesy_test_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: notesy_test
      POSTGRES_USER: notesy
      POSTGRES_PASSWORD: notesy_test_pw
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: "ci-test-key"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for SonarCloud's new-code analysis
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run build          # runs prebuild -> typecheck, then esbuild
      - run: python manage.py collectstatic --noinput
      - run: pytest -v
 
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false          # this job only proves the image builds; Milestone 3 handles publishing
